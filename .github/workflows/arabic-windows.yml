name: Arabic WordCraft Windows Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout WordCraft upstream at known commit
        uses: actions/checkout@v4
        with:
          repository: storytold/wordcraft
          ref: eae242176108d328c5dd81fbc10370c51ab90706
          path: wordcraft
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Add Arabic catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          root = Path('wordcraft/crates/ui-egui/src/i18n')
          (root / 'ar.tsv').write_bytes(gzip.decompress(base64.b64decode('')))
          mod = root / 'mod.rs'
          s = mod.read_text(encoding='utf-8')
          old = 'pub static LANGUAGES: [LangInfo; 23] = ['
          new = 'pub static LANGUAGES: [LangInfo; 24] = ['
          assert s.count(old) == 1, 'Upstream language registry format changed'
          s = s.replace(old,new)
          marker = '    LangInfo { code: "en", name: "English", source: "", prefer_hans: false, editing_lang: None, catalog: OnceLock::new() },'
          assert s.count(marker) == 1, 'Could not find English registry entry'
          addition = '\n    LangInfo { code: "ar", name: "العربية", source: include_str!("ar.tsv"), prefer_hans: false, editing_lang: None, catalog: OnceLock::new() },'
          s = s.replace(marker, marker + addition)
          mod.write_text(s,encoding='utf-8')
          print('Added Arabic interface catalog and language registry entry')
          PY
      - name: Add Arabic UI font fallback (Noto Sans Arabic)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fontPath = 'wordcraft/assets/fonts/NotoSansArabic.ttf'
          $fontUrl = 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf'
          Invoke-WebRequest -Uri $fontUrl -OutFile $fontPath
          if ((Get-Item $fontPath).Length -lt 10000) { throw 'Arabic font download was too small' }
          $licenseUrl = 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/OFL.txt'
          Invoke-WebRequest -Uri $licenseUrl -OutFile 'wordcraft/assets/fonts/NotoSansArabic-OFL.txt'
          @'
          from pathlib import Path
          p = Path('wordcraft/crates/ui-egui/src/theme.rs')
          text = p.read_text(encoding='utf-8')
          anchor = '    add(&mut fonts, "Inter", include_bytes!("../../../assets/fonts/Inter-Regular.ttf"));'
          assert text.count(anchor) == 1, 'Font initialization has changed upstream'
          text = text.replace(anchor, anchor + '\n    add(&mut fonts, "NotoArabic", include_bytes!("../../../assets/fonts/NotoSansArabic.ttf"));')
          needle = '    let add_cjk = |fonts: &mut FontDefinitions, name: String, data: FontData| {'
          assert text.count(needle) == 1, 'Font family setup has changed upstream'
          extra = """    // Fallback for Arabic UI translations, including menu titles and settings.
              for family in [FontFamily::Proportional, FontFamily::Name("medium".into()), FontFamily::Name("semibold".into())] {
                  if let Some(faces) = fonts.families.get_mut(&family) {
                      faces.push("NotoArabic".into());
                  }
              }
          """
          text = text.replace(needle, extra + needle)
          p.write_text(text, encoding='utf-8')
          print('Embedded Noto Sans Arabic as a UI fallback font')
          '@ | python -
      - name: Build WordCraft
        working-directory: wordcraft
        shell: pwsh
        run: cargo build --release --locked -p wordcraft
      - name: Package EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item wordcraft/target/release/wordcraft.exe dist/wordcraft.exe
          Compress-Archive -Path dist/wordcraft.exe -DestinationPath WordCraft-Arabic-Windows-x64.zip
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Arabic-Windows-x64
          path: WordCraft-Arabic-Windows-x64.zip
          if-no-files-found: error
